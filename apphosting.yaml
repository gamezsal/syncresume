# 1. Cloud Run Compute & Instance Bounds
runConfig:
  minInstances: 1      # Prevents cold starts by keeping 1 container warm [4]
  maxInstances: 10     # Protects against billing spikes under heavy traffic [2]
  concurrency: 80      # Max concurrent HTTP requests per instance [2]
  cpu: 1               # Dedicated compute allocation [2]
  memoryMiB: 512       # Memory limit per container instance [2, 5]

# 2. Environment Variables & Secret Manager Bindings
env:
  # --------------------------------------------------------------------------
  # A. Client-Side Public Variables (Inlined by Next.js at Build Time) [1]
  # --------------------------------------------------------------------------
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyDTsgG9qmODcWIs614Z-z7PkiM67bL44GY" # Your real Web API key from Firebase Console [6]

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "syncresume-e2d3d"

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "syncresume-e2d3d.firebaseapp.com"

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "syncresume-e2d3d.firebasestorage.app"

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "200229110740" 

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:200229110740:web:c1bdfb6857aba61ade4c41" 

  # --------------------------------------------------------------------------
  # B. Server-Side Backend Secrets (Cloud Secret Manager References) [2, 7, 8]
  # --------------------------------------------------------------------------
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY # References Secret Manager key for Gemini API [2, 8]

  - variable: GITHUB_TOKEN
    secret: GITHUB_TOKEN # References Secret Manager key for GitHub REST/GraphQL [2, 8]

  - variable: FIREBASE_SERVICE_ACCOUNT_JSON
    secret: FIREBASE_SERVICE_ACCOUNT_JSON # Secret Manager key for Admin SDK [2, 8]


    